name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/wavecaster[test]" -e "packages/emergentnet[test]"
      - name: wavecaster tests
        run: pytest -q packages/wavecaster/tests
      - name: emergentnet tests
        run: pytest -q packages/emergentnet/tests
      - name: CLI smoke test
        run: |
          wavecaster tx --profile sdr-narrow --device file:tx=b.cf32 --text "ci"
          wavecaster rx --profile sdr-narrow --device file:rx=b.cf32 --timeout 5 | grep '"ok": true'
          emergentnet bench --sk 12 --methods exact sa pt sqa --seed 1
          python packages/wavecaster/examples/custom_modulation.py
