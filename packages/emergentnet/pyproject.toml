[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emergentnet"
version = "0.2.0"
description = "Ising/QUBO and continuous optimisers (SA, parallel tempering, simulated quantum annealing, QAOA statevector, QPSO) and holographic (HRR) memory for retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "9x25dillon" }]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
gpu-torch = ["torch>=2.0"]
gpu-cupy = ["cupy-cuda12x>=13"]
embeddings = ["sentence-transformers>=2.2"]
ann = ["faiss-cpu>=1.7"]
test = ["pytest>=7"]

[project.scripts]
emergentnet = "emergentnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
